name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't let two runs on the same ref deploy on top of each other.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # The build never touches a real DB (all data pages are dynamic),
          # so placeholders are enough to satisfy env reads at build time.
          DATABASE_URL: postgresql://user:pass@localhost:5432/taskflow?schema=public
          AUTH_SECRET: ci-placeholder-not-used-at-runtime

  deploy:
    name: Deploy to EC2
    needs: ci
    # Only deploy on a real push to main — never on PRs.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd ~/taskflow
            bash scripts/deploy.sh
