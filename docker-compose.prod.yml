# Production Postgres for the single-EC2 deployment.
# Differences from docker-compose.yml (local dev):
#   - password comes from $POSTGRES_PASSWORD (loaded from .env), never hard-coded
#   - port is bound to 127.0.0.1 only, so the DB is never reachable from the internet
#
# Usage on the server:  docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:16-alpine
    container_name: taskflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: taskflow
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taskflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskflow_data:
